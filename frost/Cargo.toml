[package]
name = "frost-guardian"
version = "0.1.0"
edition = "2021"
description = "Stateless CLI for FROST ed25519-blake2b threshold signing of Nano blocks (VELA guardian network)"

[dependencies]
# Nano-compatible FROST ciphersuite from the trustlessXNOXMR swap-core workspace.
# Pinned to a pushed revision so VPS builds are reproducible. For local
# development against a checkout, use:
#   [patch."https://github.com/dhyabi2/trustlessXNOXMR.git"]
#   signing = { path = "/Users/mac/trustlessXNOXMR/swap-core/signing" }
signing = { git = "https://github.com/dhyabi2/trustlessXNOXMR.git", rev = "3170fefe76f4aa196533de422d86a157ec6c2d12" }
frost-core = { version = "2.2", features = ["internals"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
