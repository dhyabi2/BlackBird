[package]
name = "frost-guardian"
version = "0.1.0"
edition = "2021"
description = "Stateless CLI for FROST ed25519-blake2b threshold signing of Nano blocks (VELA guardian network)"

[dependencies]
frost-core = { version = "2.2", features = ["internals"] }
curve25519-dalek = { version = "4", features = ["rand_core"] }
blake2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
